name: Capstone CI
on:
  push:
    paths-ignore:
      - "README.md"
      - "PROGRESS.md"
      - "ASSET_CREDITS.md"
      - "submission/**"
      - "screenshots/**"
      - "licenses/**"
      - "CICD"
      - "django_server"
      - "loginuser"
      - "logoutuser"
      - "getdealerreviews"
      - "getalldealers"
      - "getdealerbyid"
      - "getdealersbyState"
      - "getallcarmakes"
      - "analyzereview"
  pull_request:
    paths-ignore:
      - "README.md"
      - "PROGRESS.md"
      - "submission/**"
      - "screenshots/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capstone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      MONGODB_URI: mongodb://127.0.0.1:27017/capstone_ci
      CI: "true"
      GENERATE_SOURCEMAP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/database/package-lock.json
            server/frontend/package-lock.json
      - name: Install Python and JavaScript dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci --no-audit --no-fund
          npm ci --prefix server/database --no-audit --no-fund
          npm ci --prefix server/frontend --no-audit --no-fund
      - name: Flake8 Python lint
        run: python -m flake8 server scripts
      - name: JSHint JavaScript and parsed JSX lint
        run: npm run lint:js
      - name: Django authentication and ORM tests
        run: python server/manage.py test djangoapp --verbosity 2
      - name: NLTK VADER microservice tests
        run: python -m unittest discover -s server/djangoapp/microservices/tests -v
      - name: Real MongoDB backend integration tests
        run: npm test --prefix server/database
      - name: Build React and collect Django static files
        run: |
          npm run build --prefix server/frontend
          python server/manage.py check
          python server/manage.py collectstatic --noinput
  container:
    name: Build and exercise deployment container
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build actual deployment image
        run: docker build -t openroad-capstone:ci .
      - name: Run all services with a 512 MB limit
        run: |
          docker run -d --name openroad-ci --memory=512m --cpus=1 \
            -e DJANGO_DEBUG=1 -p 18000:8000 openroad-capstone:ci
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:18000/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:18000/health
      - name: Verify real Django proxy data and bundled React
        run: |
          curl --fail http://127.0.0.1:18000/
          curl --fail http://127.0.0.1:18000/djangoapp/get_dealers/Kansas
          curl --fail http://127.0.0.1:18000/djangoapp/get_cars
          curl --fail 'http://127.0.0.1:18000/djangoapp/analyze_review?text=Fantastic%20services'
          docker stats --no-stream openroad-ci
      - name: Preserve actual container output
        if: always()
        run: docker logs openroad-ci || true
      - name: Stop test container
        if: always()
        run: docker stop openroad-ci || true
