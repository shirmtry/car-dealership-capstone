services:
  - type: web
    name: openroad-car-dealerships
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PORT
        value: "10000"
      - key: SQLITE_PATH
        value: /data/db.sqlite3
